<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vagas Operacionais | Ecofor</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="ops">
  <div id="site-header"></div>
  <main>
    <section class="page-wrap">
      <div class="container">
        <div class="jobs" id="job-list" data-kind="ops"></div>
        <form class="card-form" id="apply-form">
          <div class="form-grid">
            <div><label for="apply-name" data-i18n="forms.name">Nome</label><input id="apply-name" required></div>
            <div><label for="apply-email" data-i18n="forms.email">E-mail</label><input id="apply-email" type="email" required></div>
            <div><label for="apply-phone" data-i18n="forms.phone">Telefone</label><input id="apply-phone" required></div>
            <div><label for="role" data-i18n="forms.role">Área de interesse</label><input id="role" value="Vagas Operacionais" required></div>
            <div class="full"><label for="apply-notes" data-i18n="forms.notes">Observações</label><textarea id="apply-notes"></textarea></div>
          </div>
          <p style="margin-top:16px"><button class="btn" type="submit" data-i18n="forms.apply">Candidatar-se</button></p>
          <div class="form-ok" id="apply-ok" hidden></div>
        </form>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
